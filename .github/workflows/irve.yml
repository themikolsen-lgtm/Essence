name: Mise à jour des bornes de recharge

on:
  schedule:
    - cron: "41 3 * * 1"   # chaque lundi
  workflow_dispatch:
  push:
    paths:
      - scripts/build_irve.py
      - .github/workflows/irve.yml

permissions:
  contents: write

jobs:
  irve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_irve.py
      - name: Enregistrer les données (et le journal, même en cas d'échec)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A irve irve_log.txt 2>/dev/null || git add irve_log.txt
          git diff --cached --quiet || (git commit -m "Mise à jour des bornes de recharge" && git pull --rebase && git push)
